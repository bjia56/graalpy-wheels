graalpy:
  - gp312_250
  - gp313_253

package:
  versions: latest   # pydantic pins an exact pydantic-core; keep a matching one in the list

cibuildwheel:
  # pydantic-core is built with Rust (maturin).
  before_all: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
  environment:
    PATH: "$HOME/.cargo/bin:$PATH"
  test_command: python -c "import pydantic_core; print(pydantic_core.__version__)"
