name: Build wheel

on:
  workflow_call:
    inputs:
      package: {required: true, type: string}
      version: {required: true, type: string}
      graalpy: {required: true, type: string}
  workflow_dispatch:
    inputs:
      package: {required: true, type: string}
      version: {required: true, type: string}
      graalpy: {required: true, type: string}

jobs:
  build:
    name: ${{ inputs.package }} ${{ inputs.version }} (${{ inputs.graalpy }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install -r requirements.txt

      - name: Fetch sdist from PyPI
        run: |
          mkdir -p /tmp/sdist
          pip download --no-deps --no-binary :all: \
            -d /tmp/sdist "${{ inputs.package }}==${{ inputs.version }}"
          ls /tmp/sdist

      - name: Generate cibuildwheel config
        working-directory: scripts
        run: python cibw_config.py "${{ inputs.package }}" > /tmp/cibw.toml

      - name: Build
        env:
          CIBW_BUILD: ${{ inputs.graalpy }}-manylinux_x86_64
          CIBW_CONFIG_FILE: /tmp/cibw.toml
        run: cibuildwheel --output-dir wheelhouse /tmp/sdist/*.tar.gz

      - name: Keep only this package's wheels
        working-directory: scripts
        run: python filter_wheels.py "${{ inputs.package }}" "$GITHUB_WORKSPACE/wheelhouse"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-${{ inputs.graalpy }}
          path: wheelhouse/*.whl
          if-no-files-found: error
