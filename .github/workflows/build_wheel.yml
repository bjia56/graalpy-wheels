name: Build wheel

on:
  workflow_call:
    inputs:
      package: {required: true, type: string}
      version: {required: true, type: string}
      graalpy: {required: true, type: string}
  workflow_dispatch:
    inputs:
      package: {required: true, type: string}
      version: {required: true, type: string}
      graalpy: {required: true, type: string}

jobs:
  build:
    name: ${{ inputs.package }} ${{ inputs.version }} (${{ inputs.graalpy }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install pyyaml requests cibuildwheel==4.3.5

      - name: Fetch sdist from PyPI
        run: |
          mkdir -p /tmp/sdist
          pip download --no-deps --no-binary :all: \
            -d /tmp/sdist "${{ inputs.package }}==${{ inputs.version }}"
          ls /tmp/sdist

      - name: Generate cibuildwheel config
        working-directory: scripts
        run: python cibw_config.py "${{ inputs.package }}" > /tmp/cibw.toml

      - name: Build
        env:
          CIBW_BUILD: ${{ inputs.graalpy }}-manylinux_x86_64
          CIBW_CONFIG_FILE: /tmp/cibw.toml
        run: cibuildwheel --output-dir wheelhouse /tmp/sdist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-${{ inputs.graalpy }}
          path: wheelhouse/*.whl
          if-no-files-found: error
